name: MALVIN-XD-AUTO-LOOP

on:
  workflow_dispatch:

jobs:
  malvin-loop-task:
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout MALVIN-XD Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Run MALVIN-XD (Loop & Auto-Restart on Crash)
        run: |
          echo "Starting MALVIN-XD in persistent loop mode..."
          timeout 18000 bash -c 'while true; do npm start || echo "MALVIN-XD crashed, restarting..."; sleep 2; done'

      - name: 🔄 Re-Trigger Workflow
        if: always()
        run: |
          echo "Re-triggering MALVIN-XD workflow..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MALVIN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/malvin.yml/dispatches \
            -d '{"ref":"main"}'
